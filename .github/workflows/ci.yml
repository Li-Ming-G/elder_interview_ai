name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres-test:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: elder_interview_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_USER: elder_interview_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U elder_interview_test -d elder_interview_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      APP_ENV: test
      AUTH_ALLOWED_ORIGINS: http://127.0.0.1:4173
      AUTH_LOGIN_THROTTLE_PEPPER: test-only-login-throttle-pepper
      AI_RETENTION_CLEANUP_PEPPER: test-only-retention-cleanup-pepper
      DATABASE_URL: postgresql://elder_interview_test:local_test_only@127.0.0.1:5433/elder_interview_test
      TEST_DATABASE_URL: postgresql://elder_interview_test:local_test_only@127.0.0.1:5433/elder_interview_test
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.15.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit --run
      - run: pnpm db:migrate:deploy
      - run: pnpm db:migrate:status
      - run: pnpm test:integration --run
      - run: pnpm test:auth --run
      - run: pnpm build
      - run: pnpm test:smoke
      - run: pnpm test:e2e:install
      - run: pnpm test:e2e
      - run: pnpm test:e2e:auth -- --project=chromium
