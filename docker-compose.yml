name: elder-interview-ai

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: elder_interview_local
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_USER: elder_interview_local
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elder_interview_local -d elder_interview_local']
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql

  postgres-test:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: elder_interview_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_USER: elder_interview_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elder_interview_test -d elder_interview_test']
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - '127.0.0.1:15433:5432'
    tmpfs:
      - /var/lib/postgresql

volumes:
  postgres-dev-data:
